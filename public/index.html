<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0a0a0f">
<title>Rumi Komik</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="logo">Rumi<span>Komik</span></div>
  <form class="search" id="sf">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" placeholder="Cari manga, manhwa, manhua…" autocomplete="off">
  </form>
  <div class="filters">
    <div class="row" id="types"></div>
    <div class="row" id="stats"></div>
  </div>
</header>

<main class="wrap">
  <h2 class="sec" id="secTitle">Update Terbaru</h2>
  <div class="grid" id="grid"></div>
  <button class="more" id="more">Muat lagi</button>
</main>

<nav class="bottom" id="tabs">
  <button data-v="latest" class="on"><i>🏠</i>Terbaru</button>
  <button data-v="popular"><i>🔥</i>Populer</button>
  <button data-v="fav"><i>♥</i>Favorit</button>
  <button data-v="hist"><i>🕘</i>Riwayat</button>
</nav>

<section class="overlay" id="detail"></section>
<section class="overlay reader" id="reader">
  <div class="prog" id="prog"></div>
  <div class="rnav" id="rnav"></div>
  <div class="pages" id="pages"></div>
</section>

<script src="app.js"></script>
</body>
</html>
